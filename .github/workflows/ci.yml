name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: traycer-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: traycer-planner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      # Deterministic retrieval benchmark (no model, no network); fails if recall regresses.
      - run: npm run eval:retrieval
      - name: CLI smoke test (no credentials)
        run: |
          node dist/main.js --version
          node dist/main.js context "add pagination to the users endpoint" --repo tests/fixtures/sample-app -q
